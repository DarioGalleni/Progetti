<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1">
  <title>Photo Gallery - Hotel Gemma del Mare, Marina di Pietrasanta</title>
  <meta name="description" content="Galleria fotografica Hotel Gemma del Mare: scopri le camere, il giardino, il ristorante e gli ambienti dell'hotel a Marina di Pietrasanta.">
  <link rel="canonical" href="https://www.gemmadelmare.com/gallery.html">
  <link rel="alternate" hreflang="it" href="https://www.gemmadelmare.com/gallery.html">
  <meta name="robots" content="index,follow">
  <meta property="og:image" content="https://www.gemmadelmare.com/gallery/albumfoto/big_1587652103_DSC7494.jpg">
  <!-- CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@500&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="/web/css/fotogallery.css">
</head>
<body>
  <div class="d-flex justify-content-center">
    <img class="my-2" src="/web/struttura/logogemmadelmare.png" alt="Hotel Gemma del Mare" height="107" width="253">
  </div>
  <div id="button" class="d-flex justify-content-center">
    <button type="button" class="btn btn-lg">
      <a href="index.html">Torna Alla Home</a>
    </button>
  </div>

  <!-- Swiper (desktop >= 576px) -->
  <div class="swiper mySwiper">
    <div class="swiper-wrapper">
      <!-- foto -->
    </div>
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>
    <div class="swiper-pagination"></div>
  </div>

  <!-- Bootstrap grid (mobile < 576px) -->
  <div id="ciao" class="container">
    <div id="smartphone" class="row">
      <!-- foto -->
    </div>
  </div>

  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="/web/js/fotogallery.js"></script>
  <script>
    var swiper = new Swiper('.mySwiper', {
      effect: 'flip',
      grabCursor: true,
      pagination: { el: '.swiper-pagination' },
      navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' }
    });

    function ensureLinkRel(relName) {
      var el = document.querySelector('link[rel="' + relName + '"]');
      if (!el) {
        el = document.createElement('link');
        el.setAttribute('rel', relName);
        document.head.appendChild(el);
      }
      return el;
    }

    function updatePrevNextLinks() {
      var canonical = (document.querySelector('link[rel="canonical"]') || {}).href || window.location.href;
      var total = swiper.slides.length || 0;
      var idx = swiper.realIndex !== undefined ? swiper.realIndex : swiper.activeIndex;
      ensureLinkRel('prev').href = canonical + '#slide-' + ((idx - 1 + total) % total + 1);
      ensureLinkRel('next').href = canonical + '#slide-' + ((idx + 1) % total + 1);
    }

    swiper.on('init slideChange', updatePrevNextLinks);
    swiper.init();
    updatePrevNextLinks();
    AOS.init();
  </script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "item": { "@id": "https://www.gemmadelmare.com/", "name": "Home Page" } },
      { "@type": "ListItem", "position": 2, "item": { "@id": "https://www.gemmadelmare.com/gallery.html", "name": "Photogallery" } }
    ]
  }
  </script>
</body>
</html>
